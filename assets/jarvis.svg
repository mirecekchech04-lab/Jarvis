<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="35%" stop-color="#7febff"/>
      <stop offset="70%" stop-color="#35d6ff"/>
      <stop offset="100%" stop-color="#1b6f8c"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#071c2b"/>
      <stop offset="100%" stop-color="#02090f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#1b6f8c" stroke-width="2" opacity="0.5"/>

  <!-- tick ring -->
  <g stroke="#35d6ff" stroke-width="2" opacity="0.7" filter="url(#glow)">
    <g id="ticks">
      <line x1="128" y1="34" x2="128" y2="52"/>
    </g>
    <use href="#ticks" transform="rotate(30 128 128)"/>
    <use href="#ticks" transform="rotate(60 128 128)"/>
    <use href="#ticks" transform="rotate(90 128 128)"/>
    <use href="#ticks" transform="rotate(120 128 128)"/>
    <use href="#ticks" transform="rotate(150 128 128)"/>
    <use href="#ticks" transform="rotate(180 128 128)"/>
    <use href="#ticks" transform="rotate(210 128 128)"/>
    <use href="#ticks" transform="rotate(240 128 128)"/>
    <use href="#ticks" transform="rotate(270 128 128)"/>
    <use href="#ticks" transform="rotate(300 128 128)"/>
    <use href="#ticks" transform="rotate(330 128 128)"/>
  </g>

  <circle cx="128" cy="128" r="74" fill="none" stroke="#35d6ff" stroke-width="4" opacity="0.85" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#f9c74f" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

  <!-- triangular reactor coils -->
  <g stroke="#eafcff" stroke-width="3" fill="none" opacity="0.9" filter="url(#glow)">
    <polygon points="128,80 168,150 88,150"/>
  </g>

  <circle cx="128" cy="128" r="34" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="16" fill="#ffffff"/>
</svg>
